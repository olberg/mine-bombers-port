# dosbox-automation config for running the original Mine Bombers 3.11.
# Run from the project root, with a copy of the game in build/dosbox/game:
#   dosbox.exe --noprimaryconf --nolocalconf --conf docs/reference/testing/minebombers.dosbox.conf
# See docs/reference/testing/dosbox-setup.md for the full procedure.

[dosbox]
startup_verbosity = quiet

[webserver]
webserver_enabled = true
webserver_port    = 8386
webserver_osd     = off

[autoexec]
mount c "build\dosbox\game"
c:
MB.EXE
exit
