# DOSBox-X config for Mine Bombers fidelity audits.
# Invoke with: dosbox-x.exe -conf <this-file> original/MB.EXE
# See docs/reference/testing/dosbox-setup.md for the full procedure.

[sdl]
output       = openglpp
fullscreen   = false

[render]
aspect       = true
scaler       = none

[cpu]
core         = auto
cputype      = 486
cycles       = fixed 50000

[dosbox]
machine      = svga_s3
captures     = captures
memsize      = 16

[mixer]
rate         = 44100
blocksize    = 1024
prebuffer    = 20

[sblaster]
sbtype       = sb16
sbbase       = 220
irq          = 7
dma          = 1
oplmode      = opl3
oplrate      = 44100

[gus]
gus          = false

[speaker]
pcspeaker    = true

[joystick]
joysticktype = 2axis

[autoexec]
mount C original
C:
cls
echo Mine Bombers 3.11 - fidelity audit harness
echo Run MB.EXE, use Ctrl-F5 to screenshot, Ctrl-Alt-F5 to record video.
